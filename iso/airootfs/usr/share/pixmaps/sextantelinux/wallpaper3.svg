<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Cielo con gradiente -->
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1828" />
      <stop offset="100%" stop-color="#217D83" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky1)" />
  
  <!-- Sol abstracto en el centro -->
  <circle cx="960" cy="500" r="250" fill="#FFFFFF" opacity="0.05" />
  <circle cx="960" cy="500" r="150" fill="#FFFFFF" opacity="0.1" />

  <!-- Cadena montañosa del fondo (Azul oscuro profundo) -->
  <polygon points="-100,800 300,400 800,800" fill="#0A1828" opacity="0.6" />
  <polygon points="1200,850 1600,350 2100,850" fill="#0A1828" opacity="0.6" />
  
  <!-- Cadena montañosa principal (Azul marino del logo) -->
  <polygon points="500,850 1100,250 1800,850" fill="#112A46" />

  <!-- Base terrestre / Océano geométrico -->
  <rect x="0" y="800" width="1920" height="280" fill="#0A1828" />
  <path d="M0 820 Q 480 850 960 820 T 1920 820 L 1920 1080 L 0 1080 Z" fill="#112A46" />
  <path d="M0 860 Q 480 890 960 860 T 1920 860 L 1920 1080 L 0 1080 Z" fill="#217D83" opacity="0.4"/>

  <!-- Tipografía Sextante Linux -->
  <text x="960" y="990" font-family="sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">SEXTANTE LINUX</text>
  <text x="960" y="1040" font-family="sans-serif" font-size="22" fill="#217D83" text-anchor="middle" letter-spacing="8">T E R R I T O R I O   E N   C Ó D I G O</text>
</svg>
