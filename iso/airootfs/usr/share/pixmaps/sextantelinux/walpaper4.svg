<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sextante Linux - Wallpaper</title>
  <desc>Emblema de Sextante Linux sobre un paisaje natural nocturno de montañas y lago</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071626"/>
      <stop offset="45%" stop-color="#0E2A47"/>
      <stop offset="78%" stop-color="#13425A"/>
      <stop offset="100%" stop-color="#17A398"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#2EC4B6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAFBF8"/>
      <stop offset="45%" stop-color="#7FE0D3"/>
      <stop offset="100%" stop-color="#17A398"/>
    </linearGradient>

    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3B4A"/>
      <stop offset="100%" stop-color="#082430"/>
    </linearGradient>

    <clipPath id="lakeClip">
      <rect x="0" y="950" width="1920" height="130"/>
    </clipPath>

    <linearGradient id="wordGradLinux" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#7FE0D3"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glow)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#horizonGlow)"/>

  <!-- STARS -->
  <g fill="#F5F7FA">
    <circle cx="120" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="210" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="300" cy="60" r="1.8" opacity="0.7"/>
    <circle cx="380" cy="200" r="1.2" opacity="0.6"/>
    <circle cx="470" cy="110" r="1.5" opacity="0.9"/>
    <circle cx="90" cy="260" r="1.3" opacity="0.5"/>
    <circle cx="560" cy="70" r="1.1" opacity="0.6"/>
    <circle cx="640" cy="180" r="1.6" opacity="0.7"/>
    <circle cx="60" cy="400" r="1.2" opacity="0.4"/>
    <circle cx="180" cy="340" r="1.4" opacity="0.6"/>
    <circle cx="720" cy="250" r="1.1" opacity="0.5"/>
    <circle cx="1500" cy="80" r="1.7" opacity="0.8"/>
    <circle cx="1580" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="1650" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="1720" cy="220" r="1.1" opacity="0.5"/>
    <circle cx="1800" cy="120" r="1.6" opacity="0.9"/>
    <circle cx="1860" cy="280" r="1.2" opacity="0.5"/>
    <circle cx="1420" cy="230" r="1.3" opacity="0.6"/>
    <circle cx="1300" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="1230" cy="190" r="1.1" opacity="0.4"/>
    <circle cx="1900" cy="400" r="1.3" opacity="0.5"/>
    <circle cx="1000" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="960" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="40" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="250" cy="420" r="1.0" opacity="0.4"/>
    <circle cx="1750" cy="380" r="1.2" opacity="0.5"/>
  </g>

  <!-- FAINT CIRCUIT ACCENTS (nod to "territorio en código") -->
  <g stroke="#2EC4B6" stroke-width="1.4" fill="none" opacity="0.25">
    <path d="M40,60 L40,120 L110,120 L110,170"/>
    <circle cx="40" cy="60" r="3"/>
    <circle cx="110" cy="170" r="3"/>
    <path d="M1880,140 L1880,90 L1790,90 L1790,40"/>
    <circle cx="1880" cy="140" r="3"/>
    <circle cx="1790" cy="40" r="3"/>
    <path d="M1860,900 L1800,900 L1800,860 L1740,860"/>
    <circle cx="1860" cy="900" r="2.6"/>
    <circle cx="1740" cy="860" r="2.6"/>
  </g>

  <!-- EMBLEM (sextant + compass rose + skyline/tree/mountain/river) -->
  <g transform="translate(709,72) scale(1.86)">
    <!-- eyepiece -->
    <circle cx="120" cy="38" r="20" fill="none" stroke="#F5F7FA" stroke-width="5"/>
    <circle cx="120" cy="38" r="7" fill="#F5F7FA"/>
    <!-- mast -->
    <rect x="117" y="58" width="6" height="95" fill="#F5F7FA"/>
    <!-- index arm to hammer (upper-left) -->
    <line x1="120" y1="66" x2="48" y2="108" stroke="#F5F7FA" stroke-width="6" stroke-linecap="round"/>
    <rect x="34" y="99" width="18" height="11" rx="2" fill="#F5F7FA"/>
    <!-- telescope (upper-right) -->
    <line x1="120" y1="76" x2="210" y2="92" stroke="#F5F7FA" stroke-width="8" stroke-linecap="round"/>
    <rect x="196" y="85" width="32" height="14" rx="3" fill="#F5F7FA"/>
    <circle cx="230" cy="92" r="8" fill="none" stroke="#F5F7FA" stroke-width="3"/>
    <!-- frame legs -->
    <line x1="120" y1="70" x2="42" y2="168" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="80" x2="198" y2="168" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round"/>

    <!-- skyline (left) -->
    <g fill="#7FE0D3">
      <rect x="50" y="125" width="14" height="35"/>
      <rect x="66" y="108" width="16" height="52"/>
      <rect x="84" y="132" width="12" height="28"/>
    </g>
    <!-- tree -->
    <line x1="108" y1="150" x2="108" y2="128" stroke="#7FE0D3" stroke-width="3"/>
    <circle cx="108" cy="120" r="12" fill="#2EC4B6"/>
    <!-- mountain icon (right) -->
    <polygon points="148,150 165,116 182,150" fill="#0E2A47" stroke="#F5F7FA" stroke-width="2"/>
    <!-- river -->
    <path d="M138,158 Q149,151 160,158 T182,158 T204,158" stroke="#2EC4B6" stroke-width="3" fill="none"/>

    <!-- graduated limb (dashed arc) -->
    <path d="M 58,232 A 62,62 0 0 0 182,232" fill="none" stroke="#F5F7FA" stroke-width="3" stroke-dasharray="1,7"/>
    <!-- outer ring -->
    <circle cx="120" cy="192" r="62" fill="none" stroke="#F5F7FA" stroke-width="2" opacity="0.6"/>

    <!-- compass star -->
    <polygon points="120,144 123.4,183.7 137.0,175.0 128.3,188.6 168,192 128.3,195.4 137.0,209.0 123.4,200.3 120,240 116.6,200.3 103.0,209.0 111.7,195.4 72,192 111.7,188.6 103.0,175.0 116.6,183.7" fill="url(#starGrad)" stroke="#0E2A47" stroke-width="1"/>
    <circle cx="120" cy="192" r="6" fill="#0E2A47"/>
    <circle cx="120" cy="192" r="6" fill="none" stroke="#F5F7FA" stroke-width="1.5"/>
  </g>

  <!-- WORDMARK -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="960" y="630" font-size="66" font-weight="800" fill="#F5F7FA" letter-spacing="4">SEXTANTE <tspan fill="url(#wordGradLinux)">LINUX</tspan></text>
    <text x="960" y="672" font-size="20" fill="#7FE0D3" letter-spacing="7" font-weight="600">TERRITORIO EN CÓDIGO</text>
    <line x1="760" y1="686" x2="905" y2="686" stroke="#2EC4B6" stroke-width="1.5" opacity="0.7"/>
    <line x1="1015" y1="686" x2="1160" y2="686" stroke="#2EC4B6" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- MOUNTAINS (back) -->
  <polygon points="0,700 150,655 320,690 480,645 650,685 820,650 1000,695 1180,655 1360,690 1550,650 1750,685 1920,660 1920,1080 0,1080"
           fill="#123249" opacity="0.55"/>

  <!-- MOUNTAINS (mid) -->
  <polygon points="0,785 180,725 360,760 540,710 720,750 900,715 1080,760 1260,720 1440,755 1620,710 1800,750 1920,720 1920,1080 0,1080"
           fill="#0F4A52" opacity="0.75"/>

  <!-- MOUNTAINS (front, darkest) with pine trees along the ridge -->
  <polygon points="0,880 200,830 400,865 600,822 800,860 1000,828 1200,865 1400,828 1600,862 1800,832 1920,868 1920,1080 0,1080"
           fill="#081420"/>
  <g fill="#081420" stroke="#081420">
    <g transform="translate(200,830)">
      <polygon points="0,-30 -14,0 14,0"/>
      <polygon points="0,-18 -11,4 11,4"/>
    </g>
    <g transform="translate(600,822)">
      <polygon points="0,-32 -15,0 15,0"/>
      <polygon points="0,-19 -12,4 12,4"/>
    </g>
    <g transform="translate(1000,828)">
      <polygon points="0,-30 -14,0 14,0"/>
      <polygon points="0,-18 -11,4 11,4"/>
    </g>
    <g transform="translate(1400,828)">
      <polygon points="0,-32 -15,0 15,0"/>
      <polygon points="0,-19 -12,4 12,4"/>
    </g>
    <g transform="translate(1800,832)">
      <polygon points="0,-28 -13,0 13,0"/>
      <polygon points="0,-17 -10,4 10,4"/>
    </g>
  </g>

  <!-- LAKE -->
  <rect x="0" y="950" width="1920" height="130" fill="url(#lakeGrad)"/>
  <g clip-path="url(#lakeClip)" opacity="0.35">
    <polygon points="0,1010 200,960 400,995 600,952 800,990 1000,958 1200,995 1400,958 1600,992 1800,962 1920,998 1920,1160 0,1160"
             fill="#081420"/>
  </g>
  <g stroke="#7FE0D3" stroke-width="1.2" opacity="0.25" fill="none">
    <path d="M0,975 Q60,970 120,975 T240,975 T360,975 T480,975 T600,975 T720,975 T840,975 T960,975 T1080,975 T1200,975 T1320,975 T1440,975 T1560,975 T1680,975 T1800,975 T1920,975"/>
    <path d="M0,1010 Q80,1004 160,1010 T320,1010 T480,1010 T640,1010 T800,1010 T960,1010 T1120,1010 T1280,1010 T1440,1010 T1600,1010 T1760,1010 T1920,1010"/>
    <path d="M0,1045 Q100,1038 200,1045 T400,1045 T600,1045 T800,1045 T1000,1045 T1200,1045 T1400,1045 T1600,1045 T1800,1045 T1920,1045"/>
  </g>

  <!-- reflected compass glow on the water -->
  <ellipse cx="960" cy="985" rx="90" ry="14" fill="#2EC4B6" opacity="0.18"/>
</svg>
